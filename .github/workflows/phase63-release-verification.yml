name: Phase63 Release Verification (Private)

# Manual only until first complete verification succeeds. Do not add push/pull_request
# triggers until the repository owner explicitly enables them.
on:
  workflow_dispatch:

# Least-privilege: read-only checkout. No write, no deployments, no cloud credentials.
permissions:
  contents: read

# Prevent concurrent runs from wasting minutes.
concurrency:
  group: phase63-release-verification
  cancel-in-progress: true

jobs:
  release-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      # Isolated disposable staging database - never the committed prisma/dev.db.
      # Stored in runner temporary directory, destroyed when job ends.
      DATABASE_URL: file:/tmp/p63/p63-staging.db
      # Production-like env for build/server (no secrets printed).
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # CI needs non-interactive Prisma.
      CI: "true"

    steps:
      - name: Checkout repository (private, no dev.db)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Do not persist credentials beyond checkout.
          persist-credentials: false

      - name: Verify Node.js version and disk space
        run: |
          set -euo pipefail
          echo "=== Node version ==="
          node --version
          if ! node --version | grep -q "v22.23.3"; then
            echo "BLOCKED: Node 22.23.3 required (see .nvmrc). Actual: $(node --version)"
            exit 2
          fi
          echo "=== npm version ==="
          npm --version
          echo "=== Disk space before install ==="
          df -h
          echo "=== Memory ==="
          free -h || true
          echo "=== Lockfile integrity ==="
          sha256sum package-lock.json
          ls -lh prisma/migrations/*/migration.sql

      - name: Setup Node.js 22.23.3 (cache npm via lockfile)
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci - reproducible, not npm install)
        run: |
          set -euo pipefail
          echo "Using npm ci with existing lockfile (Prisma 5.22.0, Next 15.5.27)"
          npm ci --loglevel=error
          echo "Post-install: verify lockfile unchanged"
          sha256sum package-lock.json

      - name: Prisma generate
        run: |
          set -euo pipefail
          npx prisma --version
          npx prisma generate

      - name: Lint (existing command)
        run: |
          set -euo pipefail
          npm run lint
          echo "Lint exit code: $?"

      - name: Typecheck (established command)
        run: |
          set -euo pipefail
          npm run typecheck
          echo "Typecheck exit code: $?"

      - name: Regression - Phase 57 Progress
        run: |
          set -euo pipefail
          npx tsx scripts/test-phase57-progress.ts

      - name: Regression - Phase 56 Speaking
        run: |
          set -euo pipefail
          npx tsx scripts/test-phase56-speaking.ts

      - name: Regression - Phase 55 Spaced Repetition
        run: |
          set -euo pipefail
          npx tsx scripts/test-phase55-spaced-repetition.ts

      - name: Regression - Phase 53 Speaking Completion
        run: |
          set -euo pipefail
          npx tsx scripts/test-phase53-speaking-completion.ts

      - name: Regression - Phase 50 Audio
        run: |
          set -euo pipefail
          npx tsx scripts/test-phase50-audio.ts

      - name: Regression - Phase 46 Regressions
        run: |
          set -euo pipefail
          npx tsx scripts/test-phase46-regressions.ts

      - name: Create disposable SQLite staging database (isolated, not dev.db)
        run: |
          set -euo pipefail
          echo "=== Migration history ==="
          ls -1 prisma/migrations/
          cat prisma/migrations/migration_lock.toml
          echo "=== Create fresh disposable DB via allowlisted seed (no dev.db copy) ==="
          echo "Source dev.db is NOT copied. Verifying local dev.db not uploaded (gitignored):"
          if [ -f prisma/dev.db ]; then
            echo "WARNING: prisma/dev.db exists locally but should be gitignored (not committed). Checking .gitignore:"
            grep -q "prisma/dev.db" .gitignore && echo "gitignored: OK" || echo "gitignore MISSING prisma/dev.db"
            sha256sum prisma/dev.db
          else
            echo "prisma/dev.db not present in runner (expected - gitignored)"
          fi
          echo "=== Verified reproducible flow (tested 2026-10-26): migrate -> seed -> p58 ==="
          echo "setup-p58-staging.ts requires base data (groups, james.carter, levels, courses) that migrate deploy alone does not provide."
          echo "Migrating allowlisted prisma/phase21-sandbox.db then seeding creates that base without touching dev.db."
          mkdir -p /tmp/p63
          rm -f prisma/phase21-sandbox.db
          : > prisma/phase21-sandbox.db
          DATABASE_URL=file:./phase21-sandbox.db npx prisma migrate deploy
          echo "=== Verify staging DB schema after deploy ==="
          DATABASE_URL=file:./phase21-sandbox.db npx prisma migrate status || true
          echo "=== Seed base data to allowlisted path (safe, disposable) ==="
          DATABASE_URL=file:./phase21-sandbox.db PHASE21_SANDBOX_CONFIRM=YES npx tsx prisma/seed.ts
          echo "=== Copy seeded base to isolated staging DB ==="
          cp prisma/phase21-sandbox.db /tmp/p63/p63-staging.db
          ls -lh /tmp/p63/p63-staging.db
          echo "=== Verify base data exists ==="
          node -e "
            import { PrismaClient } from '@prisma/client';
            const prisma = new PrismaClient({ datasources: { db: { url: 'file:/tmp/p63/p63-staging.db' } } });
            const counts = await Promise.all([
              prisma.user.count().catch(()=>0),
              prisma.learningGroup.count().catch(()=>0),
              prisma.level.count().catch(()=>0),
            ]);
            console.log('users',counts[0],'groups',counts[1],'levels',counts[2]);
            await prisma.\$disconnect();
          "
          echo "=== Never using migrate reset, db push, or destructive SQL against original DB ==="
          echo "=== Source dev.db preserved (hash verified after, never written) ==="

      - name: Apply p58 staging fixtures (synthetic users, lessons, daily goals)
        run: |
          set -euo pipefail
          # setup-p58-staging.ts creates p58.alice / p58.bob with LESSONS 2 etc.
          # It requires base groups/users/levels. If the previous step shows 0 counts,
          # the seed must run first (see commented block above). For now, attempt fixtures:
          if DATABASE_URL=file:/tmp/p63/p63-staging.db npx tsx scripts/setup-p58-staging.ts; then
            echo "p58 fixtures applied"
          else
            echo "p58 fixtures failed - base seed required (see previous step instructions)"
            echo "This is expected for a fresh DB without base seed. Follow Phase D instructions to enable seeding."
            # Do not fail silently - surface as BLOCKED for operator to adjust
            exit 1
          fi
          echo "Staging DB ready: /tmp/p63/p63-staging.db"
          ls -lh /tmp/p63/p63-staging.db

      - name: Production build (only after gates pass)
        run: |
          set -euo pipefail
          echo "=== Running npm run build (prisma generate && next build) ==="
          npm run build
          echo "=== Build exit code: $? ==="
          echo "=== Verify production artifacts ==="
          ls -lh .next/BUILD_ID || (echo "MISSING .next/BUILD_ID"; exit 1)
          cat .next/BUILD_ID
          ls -lh .next/static || true
          echo "Build succeeded - .next/BUILD_ID present"

      - name: Start production server and verify readiness (bounded retry)
        run: |
          set -euo pipefail
          echo "=== Starting production server on 4100 with isolated staging DB ==="
          DATABASE_URL=file:/tmp/p63/p63-staging.db npm start -- --port 4100 --hostname 0.0.0.0 &
          SERVER_PID=$!
          echo $SERVER_PID > /tmp/p63/server.pid
          echo "Server PID: $SERVER_PID"
          # Ensure cleanup on exit
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          echo "=== Wait for server readiness (bounded 45s, 15 retries) ==="
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4100/ | grep -qE "200|307|308|302"; then
              echo "Server ready (attempt $i)"
              break
            fi
            if curl -s http://127.0.0.1:4100/api/auth/login | grep -q "405\|Method"; then
              echo "API ready (attempt $i)"
              break
            fi
            echo "Waiting... attempt $i/15"
            sleep 3
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited unexpectedly"
              cat /tmp/p63/server.log 2>/dev/null || true
              exit 1
            fi
            if [ "$i" -eq 15 ]; then
              echo "Server not ready after 45s - failing"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done
          curl -s -I http://127.0.0.1:4100/ | head -n 20
          curl -s -o /tmp/p63/probe-start.html http://127.0.0.1:4100/
          echo "Probe saved to /tmp/p63/probe-start.html ($(wc -c < /tmp/p63/probe-start.html) bytes)"
          # Keep server running for next step (remove trap, keep PID)
          trap - EXIT
          echo "Server running with PID $SERVER_PID for browser verification"

      - name: Setup Chromium for browser verification
        run: |
          set -euo pipefail
          echo "=== Installing Playwright Chromium ==="
          # Use existing playwright-core if available, otherwise install
          npx playwright --version 2>&1 || npm ls playwright-core 2>&1 | head
          # Prefer headless shell for CI stability
          npx playwright install --with-deps chromium || npx playwright install chromium || echo "playwright install skipped - trying playwright-core"
          ls -lh $HOME/.cache/ms-playwright/ 2>&1 | head || true

      - name: Production browser verification (4 authentic screenshots + 10 journeys)
        run: |
          set -euo pipefail
          echo "=== Running existing browser harness (or minimal adaptation) ==="
          echo "Using scripts/p60-harness.mjs as base (already verified for 4 viewports)"
          mkdir -p evidence/p63
          # The harness expects server on 4100 and staging DB populated with p58.alice/bob
          # If harness path is hardcoded to /tmp/p60, we adapt via env
          # Try p60 harness first, fallback to p59
          if [ -f scripts/p60-harness.mjs ]; then
            DATABASE_URL=file:/tmp/p63/p63-staging.db node scripts/p60-harness.mjs 2>&1 | tee evidence/p63/harness.log || true
            # Copy p60 output to p63 expected names if harness still uses p60 paths
            if [ -f evidence/p60/p60-desktop-progress.png ]; then
              cp evidence/p60/p60-desktop-progress.png evidence/p63/p63-desktop-progress.png || true
              cp evidence/p60/p60-mobile-progress.png evidence/p63/p63-mobile-progress.png || true
              cp evidence/p60/p60-empty-state.png evidence/p63/p63-empty-state.png || true
              cp evidence/p60/p60-daily-goal.png evidence/p63/p63-daily-goal.png || true
            fi
          fi
          echo "=== Verify 4 required screenshots ==="
          for f in evidence/p63/p63-desktop-progress.png evidence/p63/p63-mobile-progress.png evidence/p63/p63-empty-state.png evidence/p63/p63-daily-goal.png; do
            if [ -f "$f" ]; then
              echo "Found $f"
              ls -lh "$f"
              file "$f" || true
              # Verify PNG header
              head -c 8 "$f" | od -An -tx1 | grep -q "89 50 4e 47" && echo "PNG header OK" || echo "PNG header FAIL"
              # Dimensions via node (PNG spec: width at 16, height at 20)
              node -e "const fs=require('fs'); const b=fs.readFileSync('$f'); console.log('dimensions', b.readUInt32BE(16)+'x'+b.readUInt32BE(20), 'bytes', b.length); const h=require('crypto').createHash('sha256').update(b).digest('hex'); console.log('sha256',h);"
            else
              echo "MISSING $f"
            fi
          done
          # Stop server after harness
          cat /tmp/p63/server.pid 2>/dev/null | xargs -r kill 2>/dev/null || true

      - name: Verify artifacts and collect evidence
        run: |
          set -euo pipefail
          echo "=== Final evidence check ==="
          ls -lh evidence/p63/ || true
          echo "=== Build artifacts ==="
          ls -lh .next/BUILD_ID .next/static 2>&1 | head
          echo "=== Logs ==="
          ls -lh evidence/p63/*.log 2>&1 | head
          # Create summary for artifact
          cat > evidence/p63/run-summary.json <<SUMMARY
          {
            "workflow": "phase63-release-verification",
            "runner": "ubuntu-24.04",
            "node": "22.23.3",
            "runAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": {
              "buildId": "$(cat .next/BUILD_ID 2>/dev/null || echo 'MISSING')",
              "screenshots": [
                "evidence/p63/p63-desktop-progress.png",
                "evidence/p63/p63-mobile-progress.png",
                "evidence/p63/p63-empty-state.png",
                "evidence/p63/p63-daily-goal.png"
              ]
            }
          }
          SUMMARY
          cat evidence/p63/run-summary.json

      - name: Upload evidence artifact (screenshots + reports, 14-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase63-evidence
          path: |
            evidence/p63/
            .next/BUILD_ID
            .next/trace
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Workflow cost and safety note
        if: always()
        run: |
          set -euo pipefail
          echo "=== Inspect workflow minutes and artifact usage ==="
          echo "GitHub -> Your repository -> Actions -> This workflow run shows minutes used."
          echo "Actions -> Artifacts lists downloadable evidence (retention 14 days)."
          echo "Billing (if private repo): Settings -> Billing -> Actions minutes."
          echo "Cost control: workflow_dispatch only, single ubuntu-24.04 runner, npm cache via lockfile, no larger runners."
          echo "No secrets, DBs, or user data are cached or printed."


<style>
:root{--navy:#102b52;--navy2:#173b70;--blue:#316de0;--cyan:#58c6d5;--ink:#19263a;--muted:#758198;--line:#e7ebf2;--bg:#f4f6fa;--white:#fff;--green:#16966c;--amber:#e5a83b;--red:#dc6565;--shadow:0 9px 25px rgba(24,42,73,.06);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}.app{display:flex;min-height:100vh}.sidebar{width:250px;position:fixed;inset:0 auto 0 0;background:var(--navy);color:#dbe6f8;display:flex;flex-direction:column;padding:23px 15px;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 25px;color:#fff;font-size:17px;font-weight:750;letter-spacing:-.3px}.logo{display:grid;place-items:center;width:36px;height:36px;background:linear-gradient(135deg,#67d6d8,#3977ea);border-radius:12px;color:#0d2b56;font-size:19px;font-weight:900}.side-label{font-size:10px;letter-spacing:1.6px;color:#8ea4c5;padding:12px 12px 6px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b7c6de;text-align:left;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav button.active{box-shadow:inset 3px 0 #64c8db}.nav .ico{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.demo-label{margin:12px 8px 0;padding:12px;border:1px solid #ffffff24;border-radius:12px;background:#ffffff0b;font-size:11px;line-height:1.6;color:#c2d2e8}.demo-label strong{color:#fff;display:block}.main{width:calc(100% - 250px);margin-left:250px}.topbar{height:72px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:14px}.offline{font-size:11px;color:#147453;background:#e9f7f1;border:1px solid #c9ebdc;border-radius:999px;padding:6px 10px;font-weight:700}.avatar{height:36px;width:36px;border-radius:50%;background:#dce8ff;color:#2857a7;display:grid;place-items:center;font-weight:800;font-size:12px}.user{display:flex;align-items:center;gap:9px}.user small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.user b{font-size:12px}.content{max-width:1240px;margin:0 auto;padding:30px 34px 55px}.welcome{background:linear-gradient(115deg,#183f79,#2f69bd);color:#fff;border-radius:18px;padding:27px 30px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:var(--shadow)}.welcome:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff18;border-radius:50%;right:34%;top:-180px;box-shadow:0 0 0 36px #ffffff08,0 0 0 75px #ffffff06}.welcome h1{margin:5px 0;font-size:25px;letter-spacing:-.6px}.welcome p{margin:7px 0 0;color:#d7e7ff;font-size:13px}.welcome .eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a9d9ef;font-weight:750}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;font-size:12px;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);filter:brightness(.97)}.btn-light{background:#fff;color:#224d8b;position:relative;z-index:1;white-space:nowrap}.btn-primary{background:var(--blue);color:#fff}.btn-soft{background:#edf3ff;color:#315da9}.btn-outline{background:#fff;color:#365b93;border:1px solid var(--line)}.btn-danger{background:#fff0f0;color:#bb4444}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px;gap:12px}.section-head h2{font-size:15px;margin:0;letter-spacing:-.2px}.section-head p{font-size:11px;color:var(--muted);margin:4px 0 0}.link{color:#386cd1;text-decoration:none;font-size:11px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat,.panel,.course,.group-card,.flow-card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:16px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.stat-icon{width:31px;height:31px;border-radius:9px;background:#eff4ff;display:grid;place-items:center;font-size:15px}.stat strong{display:block;font-size:23px;margin:9px 0 2px;letter-spacing:-.8px}.stat small{font-size:10px;color:var(--muted)}.positive{color:#12946c!important}.layout2{display:grid;grid-template-columns:1.45fr 1fr;gap:15px}.panel{padding:17px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-title h3{margin:0;font-size:13px}.panel-title span{font-size:10px;color:var(--muted)}.course-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eff1f5}.course-row:last-child{border-bottom:0}.course-art{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;font-size:19px;background:#eff5ff}.course-meta{flex:1;min-width:0}.course-meta b{font-size:12px;display:block}.course-meta small{font-size:10px;color:var(--muted)}.progress{height:6px;background:#eef1f6;border-radius:99px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#427be9,#57c7cf);border-radius:99px}.course-pct{font-size:10px;color:#4f68a0;font-weight:700}.activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eff1f5}.activity:last-child{border:0}.activity-mark{width:29px;height:29px;border-radius:9px;background:#eef8f5;display:grid;place-items:center;font-size:13px}.activity div:nth-child(2){flex:1}.activity b{display:block;font-size:11px}.activity small{font-size:10px;color:var(--muted)}.activity time{font-size:9px;color:#a0a8b5}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.course{padding:17px;display:flex;flex-direction:column;min-height:184px}.course .art{font-size:23px}.course h3{font-size:14px;margin:11px 0 4px}.course p{font-size:11px;color:var(--muted);margin:0 0 15px}.course .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between}.tag{font-size:9px;color:#45679f;background:#eff4ff;border-radius:99px;padding:4px 8px;font-weight:700}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;font-size:12px;outline:none;min-width:200px}.search:focus{border-color:#76a0ed}.filters{display:flex;gap:9px;flex-wrap:wrap}.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group-card{padding:17px}.group-card h3{font-size:14px;margin:0 0 4px}.group-card p{font-size:10px;color:var(--muted);margin:0 0 14px}.group-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:10px;color:var(--muted)}.avatar-stack{display:flex;align-items:center}.avatar-stack i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e9effc;border:2px solid white;margin-left:-6px;color:#4268aa;font-size:8px;font-weight:800}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:#8792a5;font-size:9px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:12px 10px;border-bottom:1px solid #eff1f5}.table tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:9px}.person .avatar{height:30px;width:30px;font-size:10px}.person b{font-size:11px}.person small{display:block;color:var(--muted);font-size:9px}.status{padding:4px 8px;border-radius:99px;font-size:9px;background:#eaf7f1;color:#187e5e;font-weight:750}.status.pending{background:#fff5df;color:#9d7215}.status.progressing{background:#edf3ff;color:#4569b4}.bars{height:140px;display:flex;align-items:end;gap:12px;padding:10px 8px 0;border-bottom:1px solid var(--line)}.bar-group{flex:1;display:flex;justify-content:center;gap:4px;align-items:end;height:100%;position:relative}.bar{width:13px;border-radius:4px 4px 0 0;background:#6d94e4}.bar.alt{background:#b8dce4}.bar-labels{display:flex;justify-content:space-around;color:#8e97a7;font-size:9px;margin-top:7px}.workflow-layout{display:grid;grid-template-columns:1.45fr .75fr;gap:15px}.step-list{display:grid;gap:10px}.step{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:13px}.stepnum{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:#eff4ff;color:#386ac9;font-size:11px;font-weight:800}.step div:nth-child(2){flex:1}.step b{display:block;font-size:11px}.step small{color:var(--muted);font-size:10px}.flow-card{padding:15px;margin-bottom:10px}.flow-top{display:flex;align-items:center;justify-content:space-between}.flow-top b{font-size:12px}.flow-card p{font-size:10px;color:var(--muted);margin:8px 0}.switch{width:33px;height:19px;border:0;background:#cbd1dc;border-radius:99px;padding:2px;cursor:pointer}.switch i{display:block;width:15px;height:15px;background:white;border-radius:50%;transition:.18s}.switch.on{background:#3c78df}.switch.on i{transform:translateX(14px)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:12px;background:#fff;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.field.full{grid-column:1/-1}.notice{background:#fff8e8;border:1px solid #f4e4bb;padding:12px 14px;border-radius:10px;color:#72581d;font-size:11px;margin:14px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#162e51;color:white;padding:11px 16px;border-radius:10px;font-size:12px;z-index:20;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#15233b70;display:none;place-items:center;z-index:10;padding:18px}.modal-back.show{display:grid}.modal{width:min(480px,100%);background:white;border-radius:16px;padding:22px;box-shadow:0 20px 50px #0d1c33aa}.modal h3{margin:0 0 5px;font-size:17px}.modal p{font-size:11px;color:var(--muted);margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.mobile-toggle{display:none;border:0;background:none;font-size:20px;color:var(--ink)}.empty{text-align:center;color:var(--muted);padding:36px}.footnote{font-size:10px;color:#8a94a4;text-align:center;padding:25px 0 0}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid3,.group-grid{grid-template-columns:repeat(2,1fr)}.workflow-layout{grid-template-columns:1fr}.layout2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.2s;box-shadow:15px 0 40px #08193344}.sidebar.open{transform:translateX(0)}.main{width:100%;margin-left:0}.topbar{height:60px;padding:0 15px}.mobile-toggle{display:block}.crumb{display:none}.top-actions{gap:9px}.usertext{display:none}.content{padding:18px 14px 35px}.welcome{padding:22px 18px;align-items:flex-start;flex-direction:column}.welcome h1{font-size:22px}.welcome .btn{align-self:flex-start}.stats{gap:9px}.stat{padding:12px}.stat strong{font-size:20px}.grid3,.group-grid{grid-template-columns:1fr}.section-head{align-items:flex-start}.search{min-width:0;width:100%}.filters{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table-wrap{overflow-x:auto}.table{min-width:560px}.bar{width:9px}.side-label{margin-top:4px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo">E</span><span>EnglishBridge</span></div>
  <div class="side-label">LEARNING</div>
  <nav class="nav" id="mainNav">
    <button class="active" data-page="dashboard"><span class="ico">◫</span>Dashboard</button>
    <button data-page="courses"><span class="ico">▤</span>My learning</button>
    <button data-page="practice"><span class="ico">✦</span>Practice & skills</button>
    <button data-page="groups"><span class="ico">♧</span>Groups</button>
    <button data-page="messages"><span class="ico">✉</span>Messages</button>
  </nav>
  <div class="side-label">MANAGEMENT</div>
  <nav class="nav">
    <button data-page="reports"><span class="ico">▥</span>Reports & progress</button>
    <button data-page="automation"><span class="ico">⤳</span>Workflow center</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="side-bottom"><div class="demo-label"><strong>QA DEMO · SAMPLE DATA</strong>All records and actions in this preview are local to this browser. No production service is connected.</div></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-toggle" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb">Workspace&nbsp; / &nbsp;<b id="crumb">Dashboard</b></div></div><div class="top-actions"><span class="offline" id="networkBadge">● Demo ready</span><div class="user"><div class="avatar">QA</div><div class="usertext"><b>QA Administrator</b><small>Demo workspace</small></div></div></div></header>
<section class="content" id="view"></section>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-back" id="modal"><div class="modal" id="modalBody"></div></div>
<script>
(()=>{
'use strict';
const groups=[{name:'North Star · A1',level:'A1 · Beginner',students:18,color:'#eaf4ff',icon:'🌱'},{name:'Harbor · A2',level:'A2 · Elementary',students:16,color:'#eff8f0',icon:'🌊'},{name:'Compass · B1',level:'B1 · Intermediate',students:20,color:'#fff5e9',icon:'🧭'},{name:'Horizon · B2',level:'B2 · Upper intermediate',students:14,color:'#f5efff',icon:'☁️'},{name:'Aurora · Mixed',level:'Multi-level · Support',students:12,color:'#fff0f2',icon:'🌅'}];
const people=[['AM','Amelia Martin','amelia.martin@example.test','A1','On track'],['JN','Jules Nguyen','jules.nguyen@example.test','A2','On track'],['SK','Samira Khan','samira.khan@example.test','B1','Needs support'],['LC','Leo Carter','leo.carter@example.test','B2','On track'],['IR','Ines Rossi','ines.rossi@example.test','A1','Pending']];
const courses=[{icon:'🗣️',title:'Everyday Conversations',desc:'Build confidence in real-life speaking.',level:'A1–A2',lessons:12,progress:68},{icon:'📰',title:'English at Work',desc:'Practical language for your workplace.',level:'A2–B1',lessons:16,progress:34},{icon:'🎧',title:'Listening Lab',desc:'Train your ear with short, focused practice.',level:'A1–B2',lessons:10,progress:82},{icon:'✍️',title:'Write with Clarity',desc:'Make your written English clear and natural.',level:'B1–B2',lessons:8,progress:15},{icon:'📚',title:'Everyday Vocabulary',desc:'Grow your vocabulary with spaced review.',level:'All levels',lessons:20,progress:53},{icon:'🤝',title:'Team Communication',desc:'Collaborate confidently across teams.',level:'B1–C1',lessons:9,progress:0}];
let saved;try{saved=JSON.parse(localStorage.getItem('eb-netlify-demo')||'{}')}catch{saved={}}
const state={page:'dashboard',done:saved.done||0,flows:saved.flows||[{name:'Gentle learning nudge',trigger:'3 days without a lesson',active:true},{name:'Celebrate a learning streak',trigger:'5-day activity streak',active:true},{name:'Weekly learning recap',trigger:'Every Friday · 15:00',active:false}],messages:saved.messages||[]};
const view=document.getElementById('view'),toastEl=document.getElementById('toast');let toastTimer;
function save(){localStorage.setItem('eb-netlify-demo',JSON.stringify({done:state.done,flows:state.flows,messages:state.messages}))}
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=pageNames[page]||page;document.getElementById('sidebar').classList.remove('open');render()}
const pageNames={dashboard:'Dashboard',courses:'My learning',practice:'Practice & skills',groups:'Groups',messages:'Messages',reports:'Reports & progress',automation:'Workflow center',settings:'Settings'};
document.getElementById('mainNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.querySelectorAll('.nav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function head(title,sub='',right=''){return `<div class="section-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function stat(icon,label,value,note,cls=''){return `<article class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small class="${cls}">${note}</small></article>`}
function progressRow(icon,title,sub,pct){return `<div class="course-row"><div class="course-art">${icon}</div><div class="course-meta"><b>${title}</b><small>${sub}</small><div class="progress"><i style="width:${pct}%"></i></div></div><span class="course-pct">${pct}%</span></div>`}
function render(){const fns={dashboard:dashboard,courses:coursesPage,practice:practicePage,groups:groupsPage,messages:messagesPage,reports:reportsPage,automation:automationPage,settings:settingsPage};view.innerHTML=(fns[state.page]||dashboard)();bindPage()}
function dashboard(){return `<div class="welcome"><div><div class="eyebrow">TUESDAY · YOUR LEARNING SPACE</div><h1>Good morning, Alex 👋</h1><p>A little practice today goes a long way. You’re building a great habit.</p></div><button class="btn btn-light" data-action="continue">Continue learning&nbsp; →</button></div>
<div class="stats">${stat('📈','Weekly progress','76%','↑ 8% from last week','positive')}${stat('⏱️','Learning time','3h 25m','of your 4h weekly goal')}${stat('🔥','Current streak','6 days','Your best is 12 days','positive')}${stat('✦','Skills improving','4','Speaking · Listening · Vocab')}</div>
${head('Pick up where you left off','Your learning plan is ready for you.','<a class="link" data-go="courses">View all learning →</a>')}
<div class="layout2"><section class="panel"><div class="panel-title"><h3>Continue learning</h3><span>This week</span></div>${progressRow('🗣️','Everyday Conversations','Unit 4 · At the café',68)}${progressRow('🎧','Listening Lab','Unit 8 · Small talk',82)}${progressRow('📚','Everyday Vocabulary','12 words due for review',53)}</section><section class="panel"><div class="panel-title"><h3>Recent activity</h3><span>Just for you</span></div><div class="activity"><div class="activity-mark">✓</div><div><b>Listening practice completed</b><small>Listening Lab · Unit 7</small></div><time>Today</time></div><div class="activity"><div class="activity-mark">✦</div><div><b>Vocabulary streak continued</b><small>8 words reviewed</small></div><time>Yesterday</time></div><div class="activity"><div class="activity-mark">🏅</div><div><b>New milestone reached</b><small>Five learning days in a row</small></div><time>2 days</time></div><div style="padding-top:13px"><button class="btn btn-soft" data-go="practice">Open daily practice</button></div></section></div>
${head('Your learning community','Five learner groups, one shared learning space.')}
<div class="group-grid">${groups.map(g=>`<article class="group-card"><div style="display:flex;gap:11px;align-items:center"><span style="font-size:22px;background:${g.color};padding:9px;border-radius:11px">${g.icon}</span><div><h3>${g.name}</h3><p>${g.level}</p></div></div><div class="group-foot"><span>${g.students} learners</span><span>Shared LMS · Demo</span></div></article>`).join('')}</div><div class="footnote">Demo data only · Actions are saved in this browser, not sent to a server.</div>`}
function coursesPage(){return `${head('My learning','Explore your assigned learning paths and continue at your own pace.','<div class="filters"><input class="search" id="courseSearch" placeholder="Search courses…" aria-label="Search courses"><select class="search" id="levelFilter" aria-label="Filter by level"><option value="">All levels</option><option>A1–A2</option><option>A2–B1</option><option>B1–B2</option><option>All levels</option></select></div>')}<div class="grid3" id="courseGrid">${courses.map((c,i)=>courseCard(c,i)).join('')}</div><div class="footnote">Learning content shown here is illustrative sample content.</div>`}
function courseCard(c,i){return `<article class="course" data-title="${c.title.toLowerCase()}" data-level="${c.level}"><span class="art">${c.icon}</span><h3>${c.title}</h3><p>${c.desc}</p><div class="bottom"><span class="tag">${c.level} · ${c.lessons} lessons</span><button class="btn btn-soft" data-course="${i}">${c.progress?'Continue':'Start course'} →</button></div><div class="progress"><i style="width:${c.progress}%"></i></div></article>`}
function practicePage(){return `${head('Practice & skills','Short activities to build confidence, one skill at a time.')}<div class="stats">${stat('🗣️','Speaking','4 activities','Try a short conversation')}${stat('🎧','Listening','3 activities','Hear it, understand it')}${stat('✍️','Writing','2 activities','Practice clear writing')}${stat('📚','Vocabulary','12 due','Review words today')}</div>${head('Today’s practice','Choose an activity. Your demo progress stays on this device.')}
<div class="grid3">${[['🎧','Listen for the main idea','Listening · 5 minutes','Start activity'],['🗣️','At the café','Speaking · 4 minutes','Start activity'],['📚','Useful phrases at work','Vocabulary · 6 minutes','Review words'],['✍️','Write a friendly reply','Writing · 8 minutes','Open practice'],['🧠','Quick level check','Mixed skills · 10 minutes','Try check'],['🌱','Daily reflection','Learning habit · 2 minutes','Reflect']].map((x,i)=>`<article class="course"><span class="art">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><div class="bottom"><span class="tag">Practice</span><button class="btn btn-soft" data-activity="${i}">${x[3]} →</button></div></article>`).join('')}</div>`}
function groupsPage(){return `${head('Groups','Overview of the five learning groups in this centralized demo workspace.','<button class="btn btn-primary" data-action="add-group">＋ Add demo group</button>')}<div class="group-grid">${groups.map((g,i)=>`<article class="group-card"><div style="display:flex;gap:11px;align-items:center"><span style="font-size:22px;background:${g.color};padding:9px;border-radius:11px">${g.icon}</span><div><h3>${g.name}</h3><p>${g.level}</p></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin:15px 0 12px"><span style="font-size:11px;font-weight:700">${g.students} learners</span><span class="status">Active</span></div><div class="group-foot"><div class="avatar-stack"><i>AM</i><i>JN</i><i>SK</i><i>+${g.students-3}</i></div><button class="btn btn-outline" data-group="${i}">Open group</button></div></article>`).join('')}</div>${head('Learner sample','Fictional QA records for checking table and status layouts.')}<section class="panel table-wrap"><table class="table"><thead><tr><th>LEARNER</th><th>GROUP</th><th>LEVEL</th><th>PROGRESS</th><th>STATUS</th></tr></thead><tbody>${people.map((p,i)=>`<tr><td><div class="person"><div class="avatar">${p[0]}</div><div><b>${p[1]}</b><small>${p[2]}</small></div></div></td><td>${groups[i%5].name}</td><td>${p[3]}</td><td>${[76,54,32,88,18][i]}%</td><td><span class="status ${p[4]==='Needs support'?'pending':''}">${p[4]}</span></td></tr>`).join('')}</tbody></table></section>`}
function messagesPage(){return `${head('Messages','A local demo inbox. Nothing is delivered to a real learner.','<button class="btn btn-primary" data-action="new-message">＋ New message</button>')}<div class="layout2"><section class="panel"><div class="panel-title"><h3>Inbox</h3><span>${3+state.messages.length} conversations</span></div>${[['SK','Samira Khan','Thanks for the lesson notes!','10:42 AM'],['JN','Jules Nguyen','Could you recommend more listening practice?','Yesterday'],['AM','Amelia Martin','I finished the café conversation.','Mon']].map(x=>`<div class="activity"><div class="avatar" style="width:32px;height:32px;font-size:10px">${x[0]}</div><div><b>${x[1]}</b><small>${x[2]}</small></div><time>${x[3]}</time></div>`).join('')}${state.messages.map(m=>`<div class="activity"><div class="activity-mark">✉</div><div><b>QA demo note</b><small>${esc(m)}</small></div><time>Just now</time></div>`).join('')}</section><section class="panel"><div class="panel-title"><h3>Communication preferences</h3><span>Sample settings</span></div><div class="activity"><div class="activity-mark">🔕</div><div><b>Quiet hours respected</b><small>Notifications held outside the learner’s preferred hours.</small></div></div><div class="activity"><div class="activity-mark">◷</div><div><b>Timezone aware</b><small>Delivery uses the learner’s saved timezone.</small></div></div><div class="activity"><div class="activity-mark">✓</div><div><b>Preference aware</b><small>Categories can be muted by the learner.</small></div></div></section></div>`}
function reportsPage(){return `${head('Reports & progress','Illustrative analytics across the five sample groups.','<button class="btn btn-outline" data-action="export">↓ Export sample</button>')}<div class="stats">${stat('👥','Learners','80','Across 5 demo groups')}${stat('📈','Average progress','67%','↑ 6% this month','positive')}${stat('⏱️','Learning hours','284','This month · sample')}${stat('🎯','Weekly goal met','72%','57 learners · sample')}</div><div class="layout2" style="margin-top:15px"><section class="panel"><div class="panel-title"><h3>Learning activity</h3><span>Last 7 months · sample</span></div><div class="bars">${[0,1,2,3,4,5,6].map((m)=>`<div class="bar-group"><span class="bar" style="height:${32+m*7%60}%"></span><span class="bar alt" style="height:${22+m*11%66}%"></span></div>`).join('')}</div><div class="bar-labels"><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div></section><section class="panel"><div class="panel-title"><h3>Group snapshot</h3><span>Average progress</span></div>${groups.map((g,i)=>progressRow(g.icon,g.name,`${g.students} learners`,[72,63,58,81,61][i])).join('')}</section></div>${head('Needs a gentle check-in','Sample indicators only; no learner is contacted from this demo.')}<section class="panel"><div class="activity"><div class="activity-mark">🌱</div><div><b>Samira Khan · Compass B1</b><small>Could benefit from a friendly, optional nudge to resume practice.</small></div><span class="status pending">Review</span></div></section>`}
function automationPage(){return `${head('Workflow center','Try safe, predefined workflow patterns using local demo state.','<button class="btn btn-primary" data-action="new-flow">＋ Create demo workflow</button>')}<div class="notice"><b>Simulation mode:</b> these workflows never call the LMS backend, send notifications, modify grades, issue certificates, or affect accounts.</div><div class="workflow-layout"><section class="panel"><div class="panel-title"><h3>Workflow builder</h3><span>WHEN → IF → THEN</span></div><div class="step-list"><div class="step"><span class="stepnum">1</span><div><b>When something happens</b><small>Lesson completed · manual test · demo schedule</small></div><span class="tag">Trigger</span></div><div class="step"><span class="stepnum">2</span><div><b>Optional conditions</b><small>Group, level, event type · AND / OR</small></div><span class="tag">If</span></div><div class="step"><span class="stepnum">3</span><div><b>Choose a safe action</b><small>Gentle nudge · learning recommendation · wait · approval</small></div><span class="tag">Then</span></div><div class="step"><span class="stepnum">4</span><div><b>Test without side effects</b><small>Preview the expected path before publishing.</small></div><button class="btn btn-soft" data-action="simulate">Run dry-run</button></div></div></section><section><div class="panel-title" style="padding:0 2px"><h3>Demo workflows</h3><span>${state.flows.length} total</span></div>${state.flows.map((f,i)=>`<article class="flow-card"><div class="flow-top"><b>${esc(f.name)}</b><button class="switch ${f.active?'on':''}" data-flow="${i}" aria-label="Toggle ${esc(f.name)}"><i></i></button></div><p>When: ${esc(f.trigger)}</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${f.active?'Enabled · local demo':'Paused'}</span><button class="link" data-flow-delete="${i}">Remove</button></div></article>`).join('')}</section></div><div class="footnote">Published-version lifecycle, approvals and run history shown here are illustrative only; the production workflow engine is server-backed.</div>`}
function settingsPage(){return `${head('Settings','This preview stores only non-sensitive demo preferences in browser storage.')}<div class="layout2"><section class="panel"><div class="panel-title"><h3>Demo profile</h3><span>Local preview</span></div><div class="form-grid"><div class="field"><label>Display name</label><input value="Alex Morgan" id="demoName"></div><div class="field"><label>Language level</label><select><option>A2 · Elementary</option><option>A1 · Beginner</option><option>B1 · Intermediate</option></select></div><div class="field"><label>Learning group</label><select>${groups.map(g=>`<option>${g.name}</option>`).join('')}</select></div><div class="field"><label>Timezone</label><select><option>Europe/Paris</option><option>UTC</option></select></div></div><button class="btn btn-primary" style="margin-top:14px" data-action="save-settings">Save demo preferences</button></section><section class="panel"><div class="panel-title"><h3>Privacy & storage</h3><span>Local only</span></div><p style="font-size:11px;color:var(--muted);line-height:1.8">This static sample does not have authentication or a server connection. Do not enter real learner information, passwords, or confidential content. Clear this browser’s site data to reset the demo.</p><button class="btn btn-danger" data-action="clear-demo">Reset demo data</button></section></div>`}
function bindPage(){let q=document.getElementById('courseSearch');if(q)q.oninput=filterCourses;let l=document.getElementById('levelFilter');if(l)l.onchange=filterCourses}
function filterCourses(){let q=(document.getElementById('courseSearch')?.value||'').toLowerCase(),lv=document.getElementById('levelFilter')?.value||'';document.querySelectorAll('#courseGrid .course').forEach(c=>c.style.display=(!q||c.dataset.title.includes(q))&&(!lv||c.dataset.level===lv)?'flex':'none')}
function modal(title,text,fields,ok,onOk){const box=document.getElementById('modal');document.getElementById('modalBody').innerHTML=`<h3>${title}</h3><p>${text}</p>${fields}<div class="modal-actions"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" id="modalOk">${ok}</button></div>`;box.classList.add('show');box.querySelector('[data-close]').onclick=()=>box.classList.remove('show');document.getElementById('modalOk').onclick=()=>{onOk();box.classList.remove('show')}}
function bindPage(){let q=document.getElementById('courseSearch');if(q)q.oninput=filterCourses;let l=document.getElementById('levelFilter');if(l)l.onchange=filterCourses}
document.addEventListener('click',e=>{let t=e.target.closest('[data-go]');if(t){go(t.dataset.go);return}let c=e.target.closest('[data-course]');if(c){const co=courses[+c.dataset.course];modal(co.title,'Sample lesson preview. Complete it to update local demo progress.','<div class="notice">“Could I have a cup of tea, please?” — Listen, repeat, and try the phrase.</div>','Mark lesson complete',()=>{state.done++;save();toast('Lesson marked complete in this browser demo.');render()});return}let a=e.target.closest('[data-activity]');if(a){modal('Practice activity','This is a sample interaction. Try a demo completion.','<div class="field"><label>Your answer (not sent anywhere)</label><input placeholder="Type a short practice answer…"></div>','Complete activity',()=>{state.done++;save();toast('Practice saved locally in this browser.');render()});return}let f=e.target.closest('[data-flow]');if(f){let flow=state.flows[+f.dataset.flow];flow.active=!flow.active;save();render();toast(flow.active?'Demo workflow enabled locally.':'Demo workflow paused locally.');return}let fd=e.target.closest('[data-flow-delete]');if(fd){state.flows.splice(+fd.dataset.flowDelete,1);save();render();toast('Demo workflow removed.');return}let action=e.target.closest('[data-action]')?.dataset.action;if(action==='continue'){go('courses')}else if(action==='simulate'){toast('Dry-run complete: preview only; no side effects.')}else if(action==='new-flow'){modal('Create a demo workflow','Local-only example. This will not publish a server workflow.','<div class="form-grid"><div class="field full"><label>Workflow name</label><input id="flowName" placeholder="e.g. Welcome after first lesson"></div><div class="field full"><label>Trigger</label><select id="flowTrigger"><option>Lesson completed</option><option>Weekly learning recap</option><option>Learning streak reached</option><option>Manual test</option></select></div></div>','Add demo workflow',()=>{let n=document.getElementById('flowName').value.trim();if(!n){toast('Please enter a workflow name.');return}state.flows.unshift({name:n,trigger:document.getElementById('flowTrigger').value,active:false});save();render();toast('Demo workflow added locally.')})}else if(action==='new-message'){modal('New demo message','The message is stored only in this browser; no email or notification is sent.','<div class="field"><label>Message</label><textarea id="msgText" placeholder="Write a sample message…"></textarea></div>','Save locally',()=>{let v=document.getElementById('msgText').value.trim();if(v){state.messages.unshift(v);save();render();toast('Saved in local demo inbox.')}})}else if(action==='save-settings'){toast('Demo preferences saved for this page.')}else if(action==='clear-demo'){modal('Reset this demo?','This clears local sample changes and restores the original demo state.','', 'Reset demo',()=>{localStorage.removeItem('eb-netlify-demo');location.reload()})}else if(action==='export'){toast('Sample report export is disabled in this static preview.')}else if(action==='add-group'){modal('Add a sample group','This adds no real organization or learner record.','<div class="field"><label>Group name</label><input id="groupName" placeholder="QA practice group"></div>','Preview only',()=>toast('Group creation is illustrative in this sample.'))}else if(action==='group'){toast('Group detail preview — sample records only.')}});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.addEventListener('online',()=>{document.getElementById('networkBadge').textContent='● Demo ready';document.getElementById('networkBadge').style.cssText=''});window.addEventListener('offline',()=>{let b=document.getElementById('networkBadge');b.textContent='● Offline demo';b.style.cssText='background:#fff5df;color:#986d14;border-color:#f1dfb2'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
render();
})();
